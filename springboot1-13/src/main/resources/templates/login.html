<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập - JWT</title>

<link rel="stylesheet" href="/css/app.css">
</head>

<body>

	<div class="auth-wrapper">

		<div class="auth-card">

			<div class="logo">Nimbus</div>

			<h1 class="auth-title">Đăng nhập</h1>

			<p class="auth-subtitle">Đăng nhập vào hệ thống</p>

			<div class="form-group">
				<label for="email">Email</label> <input type="email" id="email"
					class="form-control-custom" placeholder="admin@gmail.com">
			</div>

			<div class="form-group">
				<label for="password">Mật khẩu</label> <input type="password"
					id="password" class="form-control-custom"
					placeholder="Nhập mật khẩu">
			</div>

			<button id="Login" class="btn-primary-custom">Đăng nhập</button>

			<div class="auth-link">
				Chưa có tài khoản? <a href="/signup">Đăng ký</a>
			</div>

		</div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="/js/mainjs.js"></script>

</body>
</html>
