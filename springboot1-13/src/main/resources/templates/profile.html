<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thông tin cá nhân - JWT</title>

<link rel="stylesheet" href="/css/app.css">
</head>

<body>

	<div class="profile-wrapper">

		<div class="profile-container">

			<div class="profile-card">

				<div class="profile-title">Thông tin cá nhân</div>

				<img id="images" class="profile-avatar"
					src="/images/default-avatar.png" alt="Avatar"
					onerror="this.style.display='none';">

				<div id="profile" class="profile-name">Đang tải...</div>

				<button id="logout" class="logout-btn">Đăng xuất</button>

			</div>

		</div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="/js/mainjs.js"></script>

</body>
</html>
