<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

	<div class="container mt-5" style="max-width: 500px;">

		<h2 class="text-center mb-4">Đăng ký tài khoản</h2>

		<div class="mb-3">
			<label>Họ và tên</label> <input type="text" id="fullName"
				class="form-control" placeholder="Nhập họ tên">
		</div>

		<div class="mb-3">
			<label>Email</label> <input type="email" id="email"
				class="form-control" placeholder="Nhập email">
		</div>

		<div class="mb-3">
			<label>Mật khẩu</label> <input type="password" id="password"
				class="form-control" placeholder="Nhập mật khẩu">
		</div>

		<button id="Signup" class="btn btn-primary w-100">Đăng ký</button>

		<div class="text-center mt-3">
			<a href="/login">Đã có tài khoản? Đăng nhập</a>
		</div>

	</div>

	<script>
		$(document).ready(function() {

			$('#Signup').click(function() {

				var fullName = $('#fullName').val();
				var email = $('#email').val();
				var password = $('#password').val();

				var data = JSON.stringify({
					fullName : fullName,
					email : email,
					password : password
				});

				$.ajax({
					type : "POST",
					url : "/auth/signup",
					dataType : "json",
					contentType : "application/json; charset=utf-8",
					data : data,

					success : function(data) {
						alert("Đăng ký thành công!");
						window.location.href = "/login";
					},

					error : function(e) {
						console.log(e);
						alert("Đăng ký thất bại!");
					}
				});
			});

		});
	</script>

</body>
</html>
